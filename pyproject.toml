[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bummsschloss-2026"
version = "1.1.0"
description = "Das quietschfidele Bummsschloss - a turn-based 2D artillery game."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sebastian Meinhardt" }]
keywords = ["game", "pygame", "artillery", "turn-based"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pygame-ce>=2.5",
    "paho-mqtt>=2.1",
    # Only needed behind a company proxy, but far too small to make optional.
    "pysocks>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
bummsschloss = "bummsschloss.__main__:main"

[project.gui-scripts]
bummsschloss-gui = "bummsschloss.__main__:main"

[project.urls]
Homepage = "https://github.com/"

[tool.hatch.build.targets.wheel]
packages = ["src/bummsschloss"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
